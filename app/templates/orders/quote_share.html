<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotation {{ order.number }}{% if version %} v{{ version }}{% endif %} · {{ order.customer.name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/turtle.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="quote-page">
<div class="quote-share">
  <div class="d-flex gap-2 justify-content-center flex-wrap mb-2 no-print">
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('orders.detail', order_id=order.id, tab='quotation') }}">← Back to order</a>
    <button class="btn btn-sm btn-brand" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <p class="small text-muted text-center no-print mb-2">To send on WhatsApp: press <strong>Win + Shift + S</strong>, select the card, then paste it into the chat.</p>
  {% include "orders/_quote_card.html" %}
</div>
<div id="save-indicator" class="save-indicator" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
