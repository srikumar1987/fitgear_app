{% extends "auth/_layout.html" %}
{% block card %}
<h1 class="h5 text-center mb-1">Welcome to TUR fitgear</h1>
<p class="text-muted small text-center mb-3">Set the admin password. You will use it to log in.</p>
<form method="post">
  <label class="form-label" for="password">Password (at least 6 characters)</label>
  <input id="password" name="password" type="password" class="form-control mb-2" required minlength="6" autofocus>
  <label class="form-label" for="confirm">Type it again</label>
  <input id="confirm" name="confirm" type="password" class="form-control mb-3" required minlength="6">
  <button class="btn btn-brand w-100">Save and start</button>
</form>
{% endblock %}
